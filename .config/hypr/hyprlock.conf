# KEYBOARD LAYOUT LABEL
label {
    monitor =
    text = Layout: $LAYOUT
    color = rgba(255, 255, 255, 0.6)
    font_size = 14
    font_family = JetBrains Mono Nerd Font Mono
    position = 0, -170
    halign = center
    valign = center
}

# CURRENT USER LABEL
label {
    monitor =
    text = Hello there, $USER
    color = rgba(200, 200, 200, 1.0)
    font_size = 34
    font_family = JetBrains Mono Nerd Font Mono
    position = 0, -30
    halign = center
    valign = center
}

